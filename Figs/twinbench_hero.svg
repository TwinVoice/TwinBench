<svg width="1400" height="460" viewBox="0 0 1400 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TwinBench hero</title>
  <desc id="desc">A benchmark overview for evaluating role-playing fidelity in large language models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#10243b"/>
      <stop offset="1" stop-color="#142c24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c7ff"/>
      <stop offset="0.5" stop-color="#ff6b8a"/>
      <stop offset="1" stop-color="#82d173"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1400" height="460" rx="28" fill="url(#bg)"/>
  <path d="M0 348 C170 292 270 430 454 352 C640 274 732 308 908 346 C1108 388 1254 296 1400 342 L1400 460 L0 460 Z" fill="#0b1828" opacity="0.88"/>
  <path d="M72 356 C215 304 304 396 452 344 C624 284 760 286 924 336 C1110 392 1222 334 1328 314" fill="none" stroke="url(#accent)" stroke-width="5" opacity="0.95"/>

  <g transform="translate(74 76)">
    <text x="0" y="0" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800">TwinBench</text>
    <text x="0" y="54" fill="#bfe8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Released with TwinVoice at ACL 2026</text>
    <text x="0" y="116" fill="#edf7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Evaluate how well LLMs can stay in character.</text>
    <text x="0" y="164" fill="#c7d3df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Persona memory, voice fidelity, reasoning, tone, and style across social, dialogue, and narrative role-play.</text>
  </g>

  <g transform="translate(796 78)" filter="url(#shadow)">
    <rect x="0" y="0" width="520" height="304" rx="24" fill="#f8fbff"/>
    <g transform="translate(36 34)">
      <rect x="0" y="0" width="136" height="78" rx="18" fill="#eaf7ff" stroke="#58c7ff" stroke-width="3"/>
      <text x="68" y="34" text-anchor="middle" fill="#10243b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Social</text>
      <text x="68" y="58" text-anchor="middle" fill="#37506a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">public voice</text>

      <rect x="156" y="0" width="136" height="78" rx="18" fill="#fff0f3" stroke="#ff6b8a" stroke-width="3"/>
      <text x="224" y="34" text-anchor="middle" fill="#10243b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Dialogue</text>
      <text x="224" y="58" text-anchor="middle" fill="#6a3e4b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">private style</text>

      <rect x="312" y="0" width="136" height="78" rx="18" fill="#effaec" stroke="#82d173" stroke-width="3"/>
      <text x="380" y="34" text-anchor="middle" fill="#10243b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Narrative</text>
      <text x="380" y="58" text-anchor="middle" fill="#3a5d38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">role-play</text>

      <path d="M68 92 L68 126 L224 126 L224 154" fill="none" stroke="#8aa0b7" stroke-width="3"/>
      <path d="M224 92 L224 154" fill="none" stroke="#8aa0b7" stroke-width="3"/>
      <path d="M380 92 L380 126 L224 126" fill="none" stroke="#8aa0b7" stroke-width="3"/>

      <rect x="82" y="154" width="284" height="90" rx="22" fill="#13263c"/>
      <text x="224" y="192" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Role-Playing Fidelity</text>
      <text x="224" y="222" text-anchor="middle" fill="#bdd1e6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">discriminative + generative evaluation</text>
    </g>
  </g>
</svg>
